{% set run = header.active_run %}
{% if run %}
<div id="progress" hx-get="/runs/progress" hx-trigger="every 3s" hx-swap="outerHTML">
  <a href="/runs/{{ run.id }}">
  {% if run.total is none %}Refreshing: listing clusters
  {% else %}Refreshing: {{ run.done }} of {{ run.total }} clusters, {{ run.failed }} failed{% endif %}
  </a>
  <progress max="{{ run.total or 1 }}" value="{{ run.done }}"></progress>
</div>
{% else %}
<div id="progress">
  {% if user and user.role == "admin" %}
  <form method="post" action="/runs" hx-post="/runs" hx-target="#progress" hx-swap="outerHTML" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Refresh now</button>
  </form>
  {% endif %}
</div>
{% endif %}
