annotations:
  max_value_chars: 256
  system_domains:            # annotations under these are not "custom"
    - kubernetes.io
    - k8s.io
    - cattle.io
    - helm.sh
    - rke.cattle.io
    - projectcalico.org
  keep:                      # system annotations stored anyway
    - field.cattle.io/projectId
    - meta.helm.sh/release-name
    - meta.helm.sh/release-namespace
    - ncp
    - nsx.vmware.com
    - ako.vmware.com
    - avi.vmware.com
    - metallb.universe.tf
    - metallb.io
    - kube-vip.io
    - nginx.ingress.kubernetes.io
    - cert-manager.io
    - kubernetes.io/ingress.class
  drop:                      # never stored
    - kubectl.kubernetes.io/last-applied-configuration

system_namespaces:
  - "kube-*"
  - "cattle-*"
  - "fleet-*"
  - local
  - longhorn-system
  - calico-system
  - tigera-operator
  - ingress-nginx
  - cert-manager
  - metallb-system

system_crd_groups:
  - "*.cattle.io"
  - "*.k8s.io"
  - projectcalico.org
  - cilium.io
  - monitoring.coreos.com
  - longhorn.io
  - metallb.io
  - cert-manager.io

# Objects Rancher creates on every cluster. They are not counted as custom roles,
# custom bindings or custom webhooks. Checked on the dev Rancher 2026-11-12.
rancher_generated:
  label_prefixes:
    - authz.management.cattle.io/
    - authz.cluster.cattle.io/
    - management.cattle.io/
    - objectset.rio.cattle.io/
    - fleet.cattle.io/
    - cattle.io/creator
  annotation_prefixes:
    - authz.cluster.cattle.io/
    - authz.cluster.auth.io/
    - cluster.cattle.io/
    - objectset.rio.cattle.io/
  owner_api_groups:
    - management.cattle.io
  name_patterns:
    - "cattle-*"
    - "grb-*"
    - "crb-*"
    - "globaladmin-*"

# Roles of Kubernetes itself and of platform components. Not counted as custom roles.
platform_roles:
  names: ["system:*", cluster-admin, admin, edit, view]
  label_keys: [kubernetes.io/bootstrapping, rke2.io/bootstrapping]
  label_prefixes: [cluster.x-k8s.io/provider]   # Rancher's embedded Cluster API
  owner_api_groups: [operator.tigera.io]
  helm_in_system_namespace: true                  # Helm release namespace matches system_namespaces

complexity:            # thresholds of the complexity flags (spec 6.14)
  min_k8s_minor: 32    # flag "k8s<1.32" below this minor version
  many_crds: 30        # flag "many-crds" above this many CRDs in use (needs cr_counts)

# Opt-in collectors (spec 6.12). Each needs extra RBAC from deploy/inventory-reader-extended.yaml.
# When off they make no calls. A 401 or 403 is logged and skipped; it never fails a cluster.
optional_collectors:
  cr_counts:              {enabled: false, groups: []}   # instance count per CRD of these API groups
  pvc_usage:              {enabled: false}   # used bytes per PVC from kubelet stats (nodes/proxy)
  deprecated_api_metrics: {enabled: false}   # apiserver_requested_deprecated_apis from /metrics
  secret_types:           {enabled: false}   # count of Secrets per type (table view, no data)
  nginx_config_keys:      {enabled: false}   # keys of ingress-nginx ConfigMaps, never values

# Networking facts for the migration view. Domains are annotation key prefixes.
network:
  lb_implementations:     # which LB stack serves a Service, by loadBalancerClass or annotation domain
    nsx-ncp:  {classes: [], annotation_domains: [ncp, nsx.vmware.com]}
    avi-ako:  {classes: [ako.vmware.com/avi-lb], annotation_domains: [ako.vmware.com, avi.vmware.com]}
    metallb:  {classes: [metallb.io/metallb], annotation_domains: [metallb.universe.tf, metallb.io]}
    kube-vip: {classes: [kube-vip.io/kube-vip-class], annotation_domains: [kube-vip.io]}
  pinned_ip_annotations: [metallb.universe.tf/loadBalancerIPs, metallb.io/loadBalancerIPs, kube-vip.io/loadbalancerIPs]
  shared_ip_annotations: [metallb.universe.tf/allow-shared-ip, metallb.io/allow-shared-ip]
  vendor_annotation_domains: [ncp, nsx.vmware.com, ako.vmware.com, avi.vmware.com]
  cni_daemonsets:         # CNI name -> DaemonSet names that identify it
    calico: [calico-node]
    canal: [rke2-canal, canal]
    cilium: [cilium]
    flannel: [kube-flannel-ds, kube-flannel]
    antrea: [antrea-agent]

# Database detection for the migration view. Patterns are fnmatch on the image repository name.
databases:
  exclude: ["*exporter*"]
  images:
    postgresql: ["postgres", "postgres-*", "postgresql*", "*-postgresql", "cloudnative-pg*", "spilo*", "patroni*"]
    mysql: ["mysql*", "percona-server*", "percona-xtradb*"]
    mariadb: ["mariadb*"]
    mongodb: ["mongo", "mongo-*", "mongodb*", "percona-server-mongodb*"]
    redis: ["redis", "redis-*", "valkey*"]
    elasticsearch: ["elasticsearch*", "opensearch*"]
    cassandra: ["cassandra*", "scylla*"]
    kafka: ["kafka*", "cp-kafka*", "zookeeper*"]
    clickhouse: ["clickhouse*"]
    cockroachdb: ["cockroach*"]
    influxdb: ["influxdb*"]
    rabbitmq: ["rabbitmq*"]
    minio: ["minio", "minio-*"]
    etcd: ["etcd"]
  operator_crd_groups:    # engine -> CRD API groups of its operators
    postgresql: [postgresql.cnpg.io, pgv2.percona.com, acid.zalan.do, postgres-operator.crunchydata.com]
    mysql: [ps.percona.com, pxc.percona.com, mysql.oracle.com]
    mongodb: [psmdb.percona.com, mongodbcommunity.mongodb.com]
    redis: [redis.redis.opstreelabs.in, databases.spotahome.com]
    elasticsearch: [elasticsearch.k8s.elastic.co]
    kafka: [kafka.strimzi.io]
