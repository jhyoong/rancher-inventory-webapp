kinds:
  nodes:
    path: /api/v1/nodes
    scope: cluster
    keep: [status.addresses, spec.podCIDR, status.nodeInfo.kubeletVersion,
           status.nodeInfo.osImage, status.nodeInfo.kernelVersion,
           status.nodeInfo.containerRuntimeVersion, status.nodeInfo.architecture,
           spec.unschedulable, status.capacity, status.allocatable]
    # derived: roles, provider, ready, taints (key:effect only, never values)

  namespaces:
    path: /api/v1/namespaces
    scope: cluster
    keep: [status.phase, metadata.uid]   # kube-system UID is the cluster UID
    annotations: true

  pods:
    path: /api/v1/pods
    scope: namespaced
    keep: [spec.nodeName, status.phase, status.qosClass]

  deployments:
    path: /apis/apps/v1/deployments
    scope: namespaced
    keep: [spec.replicas, status.readyReplicas]
    annotations: true
    podspec: true

  statefulsets:
    path: /apis/apps/v1/statefulsets
    scope: namespaced
    keep: [spec.replicas, status.readyReplicas]
    annotations: true
    podspec: true

  daemonsets:
    path: /apis/apps/v1/daemonsets
    scope: namespaced
    keep: [status.numberReady, status.desiredNumberScheduled]
    annotations: true
    podspec: true

  jobs:
    path: /apis/batch/v1/jobs
    scope: namespaced
    keep: [spec.parallelism, spec.completions, status.active, status.succeeded, status.failed]
    annotations: true
    podspec: true
    # jobs owned by a CronJob are skipped

  cronjobs:
    path: /apis/batch/v1/cronjobs
    scope: namespaced
    keep: [status.lastScheduleTime]
    annotations: true
    podspec: true

  replicationcontrollers:
    path: /api/v1/replicationcontrollers
    scope: namespaced
    keep: [spec.replicas, status.readyReplicas]
    annotations: true
    podspec: true

  persistentvolumes:
    path: /api/v1/persistentvolumes
    scope: cluster
    keep: [spec.capacity.storage, spec.storageClassName, spec.claimRef.namespace,
           spec.claimRef.name, status.phase]
    # derived: access_modes, volume_mode, reclaim, source, pinned (no paths or servers)

  persistentvolumeclaims:   # listed after pods: mounted and used_by come from pod claims
    path: /api/v1/persistentvolumeclaims
    scope: namespaced
    keep: [spec.storageClassName, spec.resources.requests.storage, status.phase,
           status.capacity.storage]
    annotations: true

  storageclasses:
    path: /apis/storage.k8s.io/v1/storageclasses
    scope: cluster
    keep: [provisioner, reclaimPolicy, volumeBindingMode]
    # derived: allow_expansion, default, parameter_keys (never values)

  csidrivers:
    path: /apis/storage.k8s.io/v1/csidrivers
    scope: cluster

  volumesnapshots:   # 404 means the snapshot CRDs are not installed
    path: /apis/snapshot.storage.k8s.io/v1/volumesnapshots
    scope: namespaced
    metadata_only: true

  configmaps:
    path: /api/v1/configmaps
    scope: namespaced
    metadata_only: true

  services:
    path: /api/v1/services
    scope: namespaced
    keep: [spec.type, spec.clusterIPs, spec.externalIPs, spec.loadBalancerIP,
           spec.externalName, spec.ports, status.loadBalancer.ingress]
    annotations: true
    addresses: true
    # derived: headless, has_selector, node_ports, external_traffic_policy, lb_class,
    #          source_ranges (count only), ip_families, session_affinity, annotation_keys

  ingresses:
    path: /apis/networking.k8s.io/v1/ingresses
    scope: namespaced
    keep: [spec.ingressClassName, spec.rules, spec.tls, status.loadBalancer.ingress]
    annotations: true
    addresses: true
    # derived: class, default_backend, nginx_annotations, nginx_categories, has_snippet, annotation_keys

  ingressclasses:
    path: /apis/networking.k8s.io/v1/ingressclasses
    scope: cluster
    keep: [spec.controller]

  networkpolicies:
    path: /apis/networking.k8s.io/v1/networkpolicies
    scope: namespaced
    # derived only: policy_types, namespace_wide, ipblock_peers (no CIDRs)

  priorityclasses:
    path: /apis/scheduling.k8s.io/v1/priorityclasses
    scope: cluster
    keep: [value, globalDefault]

  poddisruptionbudgets:
    path: /apis/policy/v1/poddisruptionbudgets
    scope: namespaced
    keep: [spec.minAvailable, spec.maxUnavailable, status.expectedPods, status.disruptionsAllowed]

  horizontalpodautoscalers:
    path: /apis/autoscaling/v2/horizontalpodautoscalers
    scope: namespaced
    keep: [spec.scaleTargetRef.kind, spec.minReplicas, spec.maxReplicas]

  resourcequotas:
    path: /api/v1/resourcequotas
    scope: namespaced
    # derived only: quota_cpu, quota_mem, quota_storage

  limitranges:
    path: /api/v1/limitranges
    scope: namespaced
    metadata_only: true

  serviceaccounts:
    path: /api/v1/serviceaccounts
    scope: namespaced
    metadata_only: true

  roles:
    path: /apis/rbac.authorization.k8s.io/v1/roles
    scope: namespaced
    metadata_only: true

  customresourcedefinitions:
    path: /apis/apiextensions.k8s.io/v1/customresourcedefinitions
    scope: cluster
    keep: [spec.group, spec.names.kind, spec.scope, spec.versions,
           status.storedVersions, spec.conversion.strategy]
    # versions are trimmed to name, served, storage, deprecated; schemas are dropped
    annotations: true

  helmreleases:
    path: /apis/catalog.cattle.io/v1/apps
    scope: namespaced
    keep: [spec.name, spec.namespace, spec.version,
           spec.chart.metadata.name, spec.chart.metadata.version,
           spec.chart.metadata.appVersion,
           spec.info.status, spec.info.lastDeployed, spec.resources]

  mutatingwebhookconfigurations:
    path: /apis/admissionregistration.k8s.io/v1/mutatingwebhookconfigurations
    scope: cluster
    # derived: webhooks, failure_policies, service_namespaces, url_based, rules, intercepts_all,
    #          timeouts, has_namespace_selector, helm_release, rancher_generated (URLs are not kept)

  validatingwebhookconfigurations:
    path: /apis/admissionregistration.k8s.io/v1/validatingwebhookconfigurations
    scope: cluster

  apiservices:   # aggregated APIs only; local ones are skipped
    path: /apis/apiregistration.k8s.io/v1/apiservices
    scope: cluster

  clusterroles:
    path: /apis/rbac.authorization.k8s.io/v1/clusterroles
    scope: cluster
    # derived: rule_count, aggregated, helm_managed, rancher_generated, platform

  clusterrolebindings:
    path: /apis/rbac.authorization.k8s.io/v1/clusterrolebindings
    scope: cluster
    # derived: role, subjects, rancher_generated

  rolebindings:
    path: /apis/rbac.authorization.k8s.io/v1/rolebindings
    scope: namespaced
